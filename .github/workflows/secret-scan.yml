name: Secret scan

# gitleaks on every PR and push to main (new commits only), plus a weekly full
# history + working-tree scan. Config: .gitleaks.toml; historical baseline:
# .gitleaksignore. Findings are always redacted in logs. See docs/SECRETS.md.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * 1" # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum verified)
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan new commits
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            RANGE="-1 $HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          echo "Scanning $RANGE"
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --log-opts="$RANGE" --redact=100 --no-banner --exit-code 1 -v

      - name: Scan working tree
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --redact=100 --no-banner --exit-code 1

      - name: Scan full history (weekly / manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --redact=100 --no-banner --exit-code 1
