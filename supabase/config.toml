[functions.legacy-bridge-write]
enabled = true
verify_jwt = false
# LEGACY EADB project (vaagvairvwmgyzsmymhs) only. Callers send an OverwatchDB
# access token, which EADB's gateway can't verify; the function verifies it
# against Overwatch's auth server and checks the caller's company role itself.
import_map = "./functions/legacy-bridge-write/deno.json"
entrypoint = "./functions/legacy-bridge-write/index.ts"

# ─── Intel (Osiris-derived OSINT) ─────────────────────────────────
# All public OSINT proxies. JWT verification disabled because:
#   1. The browser preflight OPTIONS request has no Authorization header
#      and would be rejected by the platform gateway before reaching the
#      function (causing the "preflight does not have HTTP ok status" CORS
#      error the user hit in production).
#   2. Auth is enforced IN CODE instead: every intel-* function (and
#      opensky-proxy) calls requireIntelUser() from _shared/intel-auth.ts
#      right after the OPTIONS short-circuit, which requires a signed-in
#      user's session JWT (the anon key is rejected) and applies a basic
#      per-user, per-isolate rate limit. (intel-cctv-ingest is cron-only and
#      uses its x-ingest-secret instead.)
#   3. The functions proxy public data (USGS, NASA, NOAA, CISA KEV, RIR
#      RDAP, PeeringDB, dns.google, crt.sh, etc.); SSRF guards in
#      _shared/ssrf-guard.ts still apply.

[functions.intel-earthquakes]
enabled = true
verify_jwt = false
entrypoint = "./functions/intel-earthquakes/index.ts"

[functions.intel-fires]
enabled = true
verify_jwt = false
entrypoint = "./functions/intel-fires/index.ts"

